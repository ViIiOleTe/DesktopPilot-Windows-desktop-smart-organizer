name: Build Windows executable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Set up MSVC x64 and Windows SDK
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build native Explorer COM bridge
        shell: cmd
        run: tools\build_native.cmd

      - name: Run tests on Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build DesktopPilot.exe
        run: python -m PyInstaller --noconfirm --clean DesktopPilot.spec

      - name: Smoke-test packaged simulated backend and DLL loading
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'desktoppilot-smoke.json'
          $process = Start-Process -FilePath .\dist\DesktopPilot.exe -ArgumentList @('--smoke-test', ('"' + $report + '"')) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "DesktopPilot smoke test failed: exit $($process.ExitCode)" }
          if (!(Test-Path $report)) { throw 'DesktopPilot smoke test did not create a report' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'ok') { throw "DesktopPilot smoke test failed: $($result | ConvertTo-Json -Compress)" }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPilot-Windows
          path: dist/DesktopPilot.exe
          if-no-files-found: error
          retention-days: 30
