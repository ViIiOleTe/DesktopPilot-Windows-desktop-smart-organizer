[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-pilot"
version = "0.2.0"
description = "A preview-first Windows Explorer desktop icon layout organizer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6==6.8.3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: File Managers",
]

[project.gui-scripts]
desktop-pilot = "desktop_pilot.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["desktop_pilot*"]

[tool.setuptools.package-data]
desktop_pilot = ["assets/*.png", "assets/*.ico", "native/*.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
